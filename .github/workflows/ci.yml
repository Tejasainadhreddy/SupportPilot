name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint + tests + conversation evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # KnowledgeMCP is installed so the MCP integration test runs against the real MCP server.
      - run: pip install -e ".[dev,local]" "knowledgemcp[mcp] @ https://github.com/Tejasainadhreddy/KnowledgeMCP/archive/main.zip"
      - run: ruff check .
      - run: pytest -q
      - name: Conversation evals (offline models; policy compliance must be 100%)
        run: python -m evals.run_evals --target local

  cdk:
    name: CDK synth tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r infra/requirements.txt
      - run: cd infra && pytest -q

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: supportpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
